name: Release

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Upbound Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.UPBOUND_ROBOT_USERNAME }}
          password: ${{ secrets.UPBOUND_ROBOT_TOKEN }}

      - name: Install up CLI (>= v0.39.0 for alpha append)
        run: |
          set -euxo pipefail
          # Download installer script (produces local ./up binary)
          curl -sL https://cli.upbound.io | sh
          mkdir -p "$HOME/bin"
          mv up "$HOME/bin/up"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/up" version

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Get branch for tag
        run: |
          git fetch --all
          BRANCH=$(git branch -r --contains ${{ github.sha }} \
            | grep -v HEAD \
            | sed 's|origin/||' \
            | tr -d ' ' \
            | head -1)
          echo "Branch: $BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Build and Publish
        env:
          BRANCH_NAME: ${{ env.BRANCH }}
          REGISTRY_ORGS: docker.io/exoscale xpkg.upbound.io/exoscale
          XPKG_REG_ORGS: docker.io/exoscale xpkg.upbound.io/exoscale
          XPKG_REG_ORGS_NO_PROMOTE: xpkg.upbound.io/exoscale
          VERSION: ${{ github.ref_name }}
        run: |
          make build.all publish

      - name: Append Marketplace Extension Assets
        env:
          UPBOUND_ROBOT_TOKEN: ${{ secrets.UPBOUND_ROBOT_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          up login --token $UPBOUND_ROBOT_TOKEN --account exoscale
          up alpha xpkg append --extensions-root=./extensions xpkg.upbound.io/exoscale/provider-exoscale:$VERSION
